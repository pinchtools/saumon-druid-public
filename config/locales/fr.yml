        hierarchy_levels:
          1:
            label: "Autorités constitutionnelles et exécutives supérieures"
            description: "Inclut le Président, les Ministres et les plus hautes instances constitutionnelles et judiciaires. Influence nationale maximale."
          2:
            label: "Mandats législatifs nationaux"
            description: "Membres élus du Parlement (Assemblée nationale et Sénat). Légitimité démocratique centrale."
          3:
            label: "Direction des chambres"
            description: "Postes de direction internes des chambres législatives, par exemple le Bureau, la Conférence des Présidents."
          4:
            label: "Commissions parlementaires et institutions mixtes"
            description: "Commissions législatives, commissions mixtes et commissions spéciales qui influencent l'élaboration des lois."
          5:
            label: "Groupes politiques, délégations et conseils supérieurs"
            description: "Groupes politiques, délégations parlementaires, conseils et postes élus régionaux."
          6:
            label: "Structures thématiques, externes et internationales"
            description: "Groupes d’études, groupes d’amitié, délégations internationales, missions extra-parlementaires ou thématiques."
          7:
            label: "Affiliations locales et politiques"
            description: "Conseils municipaux, intercommunalité, partis politiques, circonscriptions."

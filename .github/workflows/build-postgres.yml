name: Build and Push Postgres Image

on:
  push:
    paths:
      - 'Dockerfile.postgres'
    branches: [main, staging]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.postgres
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/saumon-druid-postgres:latest
            ghcr.io/${{ github.repository_owner }}/saumon-druid-postgres:${{ github.sha }}

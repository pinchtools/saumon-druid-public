services:
  postgresql:
    image: postgres:17-alpine
    restart: always
    volumes:
      - ~/data/postgres/saumon-druid:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=foo
      - POSTGRES_DB=saumon_druid_development
    ports:
      - "5433:5432"
    networks:
      - default
  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - "6380:6379"
    networks:
      - default
  web:
    build: .
    volumes:
      - .:/rails
    depends_on:
      - postgresql
      - redis
    ports:
      - "3005:3000"
    environment:
      - POSTGRES_HOST=postgresql
      - POSTGRES_PASSWORD=foo
    networks:
      - saumon_network
      - default

networks:
  saumon_network:
    external: true

services:
  postgresql:
    image: pgvector/pgvector:pg18
    restart: always
    volumes:
      - ~/data/postgres/saumon-druid:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=foo
      - POSTGRES_DB=saumon_druid_development
    ports:
      - "5433:5432"
    networks:
      - default
  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - "6380:6379"
    networks:
      - default
  web:
    build: .
    volumes:
      - .:/rails
    depends_on:
      - postgresql
      - redis
    ports:
      - "3005:3000"
    environment:
      - POSTGRES_HOST=postgresql
      - POSTGRES_PASSWORD=foo
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - saumon_network
      - default
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - default
volumes:
  ollama_data:

networks:
  saumon_network:
    external: true
